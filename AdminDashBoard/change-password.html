<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Change Password</title>
  <link rel="stylesheet" href="Admin.css"/>
</head>
<body>
  <nav class="admin-navbar">
    <div class="nav-left"><a href="index.html" class="brand">BookStore</a></div>
    <ul class="nav-links">
      <li><a href="Admin.html">Dashboard</a></li>
      <li><a href="change-password.html">Change Password</a></li>
      <li><a id="logoutBtn" href="#">Logout</a></li>
    </ul>
  </nav>

  <header class="admin-header"><h1>Change Password</h1></header>

  <div class="admin-wrapper">
    <section>
      <form id="changePasswordForm">
        <div class="form-group">
          <label>Current Password</label>
          <input type="password" id="currentPassword" required />
        </div>
        <div class="form-group">
          <label>New Password</label>
          <input type="password" id="newPassword" required />
        </div>
        <div class="form-group">
          <label>Confirm New Password</label>
          <input type="password" id="confirmPassword" required />
        </div>
        <button type="submit">Change Password</button>
      </form>
    </section>
  </div>

  <script src="change-password.js"></script>
  <script>
    document.getElementById('logoutBtn').addEventListener('click', (e)=>{ e.preventDefault(); localStorage.removeItem('token'); window.location.href='../Student-Dahbord/login.html'; });
  </script>
</body>
</html>
