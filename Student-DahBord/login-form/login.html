<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login-page</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <form action="" method="post" class="login-container">
        <h2 class="login-heading">
            Login
        </h2>

        <div class="input-items">
            <input type="text" placeholder="Matric no." class=" input-text" required autocomplete="on">

            <input type="password" placeholder="password" class="input-password" required>

            <label for="checkbox" class="checkbox-label">
                <input type="checkbox">Savepassword
            </label>
        </div>

        <div class="login-button">
            <button>Submit</button>
        </div>

        <div>
            <a href="#">forgot password</a>
            <a href="signup.html">Don't have acc.?</a>
        </div>

    </form>

    <!-- added a footer to the page -->
    <footer>
            University of Nigeria Nsukka Library ©2025
        </footer>

</body>
</html>
