<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up | Secure Portal</title>
  <link rel="stylesheet" href="login.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>
  <div class="main-container">
    <!-- Left side with branding -->
    <div class="branding-section">
      <div class="branding-content">
        <div class="logo">
          <i class="fas fa-shield-alt"></i>
          <span>SecurePortal</span>
        </div>
        <h1>Join Our Community</h1>
        <p>Create an account to unlock exclusive features and personalized experiences.</p>
        <div class="features">
          <div class="feature">
            <i class="fas fa-rocket"></i>
            <span>Get Started in Minutes</span>
          </div>
          <div class="feature">
            <i class="fas fa-chart-line"></i>
            <span>Track Your Progress</span>
          </div>
          <div class="feature">
            <i class="fas fa-headset"></i>
            <span>24/7 Support</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Right side with form -->
    <div class="form-section">
      <div class="form-container">
        <div class="form-header">
          <h2>Create Your Account</h2>
          <p>Fill in your details to get started</p>
        </div>

        <form id="signupForm" class="form">
          <div class="input-group">
            <label for="name">
              <i class="fas fa-user"></i> Full Name
            </label>
            <input type="text" id="name" placeholder="Enter your full name" required />
          </div>

          <div class="input-group">
            <label for="email">
              <i class="fas fa-envelope"></i> Email Address
            </label>
            <input type="email" id="email" placeholder="Enter your email" required />
          </div>

          <div class="input-group">
            <label for="password">
              <i class="fas fa-key"></i> Password
            </label>
            <div class="password-wrapper">
              <input type="password" id="password" placeholder="Create a strong password" required />
              <button type="button" class="toggle-password" id="togglePassword">
                <i class="fas fa-eye"></i>
              </button>
            </div>
            <div class="password-strength">
              <div class="strength-bar">
                <div class="strength-fill" id="strengthFill"></div>
              </div>
              <span class="strength-text" id="strengthText">Password strength</span>
            </div>
          </div>

          <div class="input-group">
            <label for="confirmPassword">
              <i class="fas fa-key"></i> Confirm Password
            </label>
            <div class="password-wrapper">
              <input type="password" id="confirmPassword" placeholder="Re-enter your password" required />
              <button type="button" class="toggle-password" id="toggleConfirmPassword">
                <i class="fas fa-eye"></i>
              </button>
            </div>
            <div id="passwordMatch" class="validation-message"></div>
          </div>

          <div class="terms">
            <label class="checkbox-container">
              <input type="checkbox" id="terms" required>
              <span class="checkmark"></span>
              I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
            </label>
          </div>

          <button type="submit" class="submit-btn">
            <span class="btn-text">Create Account</span>
            <i class="fas fa-user-plus"></i>
          </button>

          <div class="divider">
            <span>Or sign up with</span>
          </div>

          <div class="social-login">
            <button type="button" class="social-btn google">
              <i class="fab fa-google"></i>
              <span>Google</span>
            </button>
            <button type="button" class="social-btn github">
              <i class="fab fa-github"></i>
              <span>GitHub</span>
            </button>
          </div>

          <div class="switch">
            Already have an account?
            <a href="login.html" class="switch-link">Sign In</a>
          </div>

          <div id="signupMessage" class="message"></div>
        </form>
      </div>
    </div>
  </div>

  <script src="signup.js"></script>
</body>
</html>
